name: Build macOS

# 手动触发，或推送 v1.0.0 这类 tag 时触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    # macos-15 构建机，可同时交叉打包 arm64 和 x64
    runs-on: macos-15
    env:
      # 没有 Apple Developer 证书，跳过签名探测，产出未签名安装包
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer / main / preload
        run: npm run build

      - name: Package macOS (arm64)
        # 先只打 M 系列（arm64），体积约 110 MB；需要 Intel 版时把 --x64 加回来
        run: npx electron-builder --mac --arm64 --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: EasyOffer-macOS
          if-no-files-found: error
          retention-days: 30
          # 只传 dmg，不传 zip：zip 是给自动更新用的，用户下载不了
          path: dist/*.dmg

# GitHub Actions re-index
